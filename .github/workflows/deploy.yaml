name: Build and Deploy LaTeX to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up TeX Live
        uses: xu-cheng/latex-action@v2
        with:
          # Use the full TeX Live 2023 distribution to ensure all packages are available
          texlive_version: 2023
          # Install the full scheme (all packages) – needed for custom libraries and images
          install_full: true

      - name: Compile LaTeX document
        run: |
          # Compile the main document; latexmk runs pdflatex the required number of times
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # The PDF (and any auxiliary files you want to expose) are placed in the root of the site
          path: ./main.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v3
